spring:
  application:
    name: gateway-api
  cloud:
    config:
      discovery:
        enabled: true
      name: config-service
  config:
    import: "optional:configserver:"

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true